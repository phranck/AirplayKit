name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            swiftFlags: -lc++ -framework CoreFoundation
          - name: Linux
            runner: ubuntu-latest
            swiftFlags: -lstdc++ -lpthread -ldns_sd

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # dns_sd.h ships with macOS. On Linux it comes from Avahi's compatibility
      # package, which is the same header and the same calls.
      - name: Install libdns_sd
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavahi-compat-libdnssd-dev

      # macOS brings a Swift toolchain with Xcode. Linux does not.
      - name: Install Swift
        if: matrix.runner == 'ubuntu-latest'
        uses: swift-actions/setup-swift@v2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The README tells a consumer that the one archive and a handful of system
      # libraries are the whole of it, and that Swift imports the header as a
      # module. Building the example is what keeps both promises honest.
      - name: Build the example
        env:
          SWIFT_FLAGS: ${{ matrix.swiftFlags }}
        run: |
          swiftc -O -I include example/Demo.swift -o build/Demo \
              -Xlinker build/libPlayableAirplay.a $SWIFT_FLAGS

      # Called without arguments it prints its usage and exits with 2, and
      # anything else means it is broken.
      - name: Run the example
        run: ./build/Demo || test $? -eq 2
