name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            swiftFlags: -lc++ -framework CoreFoundation
          - name: Linux
            runner: ubuntu-latest
            swiftFlags: -lstdc++ -lpthread -ldns_sd

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # dns_sd.h ships with macOS. On Linux it comes from Avahi's compatibility
      # package, which is the same header and the same calls.
      - name: Install libdns_sd
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavahi-compat-libdnssd-dev

      # macOS brings a Swift toolchain with Xcode. Linux does not.
      - name: Install Swift
        if: matrix.runner == 'ubuntu-latest'
        uses: swift-actions/setup-swift@v2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The README tells a consumer that the Swift wrapper, the one archive and a
      # handful of system libraries are the whole of it. Building the example
      # exactly that way is what keeps the instruction honest.
      - name: Build the example
        env:
          SWIFT_FLAGS: ${{ matrix.swiftFlags }}
        run: |
          swiftc -O -I include Sources/PlayableAirplay.swift example/Demo.swift \
              -o build/Demo -Xlinker build/libPlayableAirplay.a $SWIFT_FLAGS

      # Called without arguments it prints its usage and exits with 2, and
      # anything else means it is broken.
      - name: Run the example
        run: ./build/Demo || test $? -eq 2

  site:
    name: Site
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The page and the reference are built from the Swift sources, the header
      # and Website/, all of which are in this repository, so the submodule
      # stays where it is.
      - name: Build
        run: ./Scripts/build-site.sh --host

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  publish:
    name: Publish the site
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
