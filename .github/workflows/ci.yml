name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Xcode 27.0 reports Swift 6.4, the version .swift-version names and the Linux
# container runs. Only Apple's tools read DEVELOPER_DIR, so the build job sets it
# for macOS and leaves the Linux container untouched.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    # Linux builds inside the official Swift image, which brings the toolchain
    # with it. Installing one on a bare runner took a quarter of an hour, which
    # is not a gate anybody waits for.
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: xcode-27
            container: ""
          - name: Linux
            runner: ubuntu-latest
            container: swift:6.4.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dns_sd.h ships with macOS. On Linux it comes from Avahi's compatibility
      # package, which is the same header and the same calls.
      - name: Install libdns_sd
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y libavahi-compat-libdnssd-dev

      # Scripts/check-linux.sh runs in this same image, so a red run here is one
      # that could have been seen before the push. Only the macOS job sets
      # DEVELOPER_DIR. A Linux job that inherits a path to Xcode fails in Swift Build.
      - name: Select Xcode 27.0
        if: matrix.container == ''
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./Scripts/build-and-test.sh

  # The site uses the same Swift 6.4 toolchain as the macOS build job.
  site:
    name: Site
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The page and the reference are built from the Swift sources, the header
      # and Website/, all of which are in this repository, so the submodule
      # stays where it is.
      - name: Build
        run: ./Scripts/build-site.sh

      # The git-pages instance on the MacServer accepts the site through its public
      # address. One tar replaces what the instance holds, and the password whose
      # hash stands in the TXT record _git-pages-challenge.airplaykit.layered.work
      # authorizes it. A dry run goes first and changes nothing. macOS's tar leaves
      # out resource forks and extended attributes, which would otherwise arrive
      # as ._ files on the site.
      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          PAGES_PASSWORD: ${{ secrets.PAGES_PASSWORD }}
        run: |
          set -euo pipefail
          site="https://airplaykit.layered.work/"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C build/site -cf - . |
            curl --fail-with-body --silent --show-error -X PUT \
              -H "Dry-Run: yes" \
              -H @<(printf 'Authorization: Pages %s\n' "$PAGES_PASSWORD") \
              -H "Content-Type: application/x-tar" \
              --data-binary @- "$site"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C build/site -cf - . |
            curl --fail-with-body --silent --show-error -X PUT \
              -H @<(printf 'Authorization: Pages %s\n' "$PAGES_PASSWORD") \
              -H "Content-Type: application/x-tar" \
              --data-binary @- "$site"
          # The instance answers ok once a site is published on it.
          test "$(curl --fail-with-body --silent --show-error "${site}.git-pages/health")" = "ok"
