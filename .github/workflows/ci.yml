name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Xcode 26.3 carries Swift 6.2.3, which is the version .swift-version names and
# the version the Linux container below runs. Without this the macOS runner uses
# whichever Xcode it happens to default to, and that compiler has already
# rejected code every local gate had passed.
#
# Set for the whole workflow rather than per job, so the version stands in one
# place. Linux ignores it, because only Apple's tools read it.
env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    # Linux builds inside the official Swift image, which brings the toolchain
    # with it. Installing one on a bare runner took a quarter of an hour, which
    # is not a gate anybody waits for.
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            container: ""
          - name: Linux
            runner: ubuntu-latest
            container: swift:6.2.3

    steps:
      - uses: actions/checkout@v7

      # dns_sd.h ships with macOS. On Linux it comes from Avahi's compatibility
      # package, which is the same header and the same calls.
      - name: Install libdns_sd
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y libavahi-compat-libdnssd-dev

      # The same script Scripts/check-linux.sh runs in this same image, so a red
      # run here is one that could have been seen before the push.
      - name: Build and test
        run: ./Scripts/build-and-test.sh

  site:
    name: Site
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The page and the reference are built from the Swift sources, the header
      # and Website/, all of which are in this repository, so the submodule
      # stays where it is.
      - name: Build
        run: ./Scripts/build-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  publish:
    name: Publish the site
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
