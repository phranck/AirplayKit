name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Xcode 27.0, the only Xcode the MacServer runner has, reports Swift 6.4, which is
# the version .swift-version names and the version the Linux container below runs.
# Read from the runner, not from a release note. Without this the macOS runner
# would use whichever Xcode it defaults to, and that compiler has already rejected
# code every local gate had passed.
#
# Set on the build job, where the version stands in one place. Linux ignores it,
# because only Apple's tools read it.

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    # Linux builds inside the official Swift image, which brings the toolchain
    # with it. Installing one on a bare runner took a quarter of an hour, which
    # is not a gate anybody waits for.
    container: ${{ matrix.container }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            container: ""
          - name: Linux
            runner: ubuntu-latest
            container: swift:6.4.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.container == ''

      # actions/checkout runs Node inside the job's container, and Gitea's runner, unlike GitHub's,
      # brings none into it. The Swift image carries git, which fetches the pushed commit itself.
      - name: Check out
        if: matrix.container != ''
        run: |
          git init --quiet .
          git fetch --quiet --depth 1 "${{ github.server_url }}/${{ github.repository }}.git" "${{ github.sha }}"
          git checkout --quiet FETCH_HEAD

      # dns_sd.h ships with macOS. On Linux it comes from Avahi's compatibility
      # package, which is the same header and the same calls.
      - name: Install libdns_sd
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y libavahi-compat-libdnssd-dev

      # The same script Scripts/check-linux.sh runs in this same image, so a red
      # run here is one that could have been seen before the push.
      # The macOS job runs with Xcode 27.0, the Xcode the runner has installed. Xcode 26.3,
      # which the job pinned before, is not installed there. Only the macOS job sets it:
      # a Linux job that inherits a path to Xcode fails in Swift Build.
      - name: Select Xcode 27.0
        if: matrix.container == ''
        run: echo "DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./Scripts/build-and-test.sh

  # The MacServer runner has Xcode 27.0 installed and no Xcode 26.3, so the site is built with 27.0.
  site:
    name: Site
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The page and the reference are built from the Swift sources, the header
      # and Website/, all of which are in this repository, so the submodule
      # stays where it is.
      - name: Build
        run: ./Scripts/build-site.sh

      # The site has its own git-pages instance on the MacServer, which publishes
      # on the loopback port 3510 of that server, so the publish reaches it before
      # Caddy points the host at it. The Host header names the site. The site is
      # one tar that replaces what it held, and the password whose hash stands in
      # the TXT record _git-pages-challenge.airplaykit.layered.work authorizes it.
      # A dry run goes first and changes nothing. macOS's tar leaves out its
      # resource forks and extended attributes, which would otherwise arrive as
      # ._ files on the site.
      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          PAGES_PASSWORD: ${{ secrets.PAGES_PASSWORD }}
        run: |
          set -euo pipefail
          site="http://127.0.0.1:3510/"
          host="airplaykit.layered.work"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C build/site -cf - . |
            curl --fail-with-body --silent --show-error -X PUT \
              -H "Host: $host" -H "Dry-Run: yes" \
              -H @<(printf 'Authorization: Pages %s\n' "$PAGES_PASSWORD") \
              -H "Content-Type: application/x-tar" \
              --data-binary @- "$site"
          COPYFILE_DISABLE=1 tar --no-mac-metadata -C build/site -cf - . |
            curl --fail-with-body --silent --show-error -X PUT \
              -H "Host: $host" \
              -H @<(printf 'Authorization: Pages %s\n' "$PAGES_PASSWORD") \
              -H "Content-Type: application/x-tar" \
              --data-binary @- "$site"
          # The instance answers ok for a host once a site is published on it.
          test "$(curl --fail-with-body --silent --show-error -H "Host: $host" "${site}.git-pages/health")" = "ok"
