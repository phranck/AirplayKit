name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Linux
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # dns_sd.h ships with macOS. On Linux it comes from Avahi's compatibility
      # package, which is the same header and the same calls.
      - name: Install libdns_sd
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavahi-compat-libdnssd-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The example is the interface used from outside the library, so it is
      # worth knowing that it links and runs. Called without arguments it prints
      # its usage and exits with 2, and anything else means it is broken.
      - name: Smoke-test the example
        run: ./build/pa_demo || test $? -eq 2
